name: Source validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.3"
      - name: Install JarvisBench
        run: python -m pip install -e '.[test]'
      - name: Validate source and task contracts
        run: ./scripts/validate.sh
      - name: Validate OpenClaw supervisor contracts
        run: node --test tests/typescript/*.test.ts
      - name: Reject high or critical runtime advisories
        run: ./scripts/audit-runtime.sh
