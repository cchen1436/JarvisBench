[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "jarvisbench"
version = "0.1.0rc2"
description = "A benchmark for allocating scarce user attention during long-horizon agent work."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openai==2.48.0"]

[project.optional-dependencies]
test = ["hatchling==1.27.0", "pytest==8.3.5"]

[project.scripts]
jarvisbench = "jarvisbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvisbench"]

[tool.hatch.build.targets.wheel.force-include]
"plugins/openclaw/jarvis_supervisor" = "jarvisbench/_resources/openclaw/jarvis_supervisor"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
